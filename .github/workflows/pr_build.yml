name: Pull Request Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      debug:
        description: 'Build in debug mode'
        required: false
        default: false
        type: boolean

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies (Windows)
        shell: pwsh
        run: |
          vcpkg integrate install
          vcpkg install libvpx:x64-windows-static-md opus:x64-windows-static-md
          $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
          $includePath = "$vcpkgRoot\installed\x64-windows-static-md\include"
          $libPath = "$vcpkgRoot\installed\x64-windows-static-md\lib"
          echo "VCPKG_ROOT=$vcpkgRoot" >> $env:GITHUB_ENV
          echo "C_INCLUDE_PATH=$includePath" >> $env:GITHUB_ENV
          echo "CPLUS_INCLUDE_PATH=$includePath" >> $env:GITHUB_ENV
          echo "LIBRARY_PATH=$libPath" >> $env:GITHUB_ENV
          echo "BINDGEN_EXTRA_CLANG_ARGS=-I$includePath" >> $env:GITHUB_ENV

      - name: Install frontend dependencies
        run: npm install

      - name: Build the app (Release)
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.debug }}
        env:
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run tauri:build

      - name: Build the app (Debug)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug }}
        env:
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run tauri:build:debug

      - name: Upload artifacts (Windows)
        uses: actions/upload-artifact@v4
        with:
          name: clever-kvm-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/clever-kvm.exe
          if-no-files-found: warn
