name: Manual Build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build for'
        required: true
        default: 'ubuntu-latest'
        type: choice
        options:
          - ubuntu-latest
          - windows-latest
          - macos-latest
      debug:
        description: 'Build in debug mode'
        required: false
        default: false
        type: boolean

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ${{ inputs.platform }}
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ inputs.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies (Ubuntu)
        if: inputs.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libssl-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libxcb-randr0-dev xdg-desktop-portal libpipewire-0.3-dev libopus-dev \
            libavformat-dev libavcodec-dev libavutil-dev libswscale-dev libswresample-dev \
            patchelf libxrandr-dev libvpx-dev libsoup-2.4-dev libclang-dev

      - name: Install dependencies (macOS)
        if: startsWith(inputs.platform, 'macos')
        run: |
          brew install libvpx opus ffmpeg llvm
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> $GITHUB_ENV
          echo "C_INCLUDE_PATH=$(brew --prefix libvpx)/include" >> $GITHUB_ENV
          echo "CPLUS_INCLUDE_PATH=$(brew --prefix libvpx)/include" >> $GITHUB_ENV

      - name: Install dependencies (Windows)
        if: inputs.platform == 'windows-latest'
        shell: pwsh
        run: |
          vcpkg integrate install
          vcpkg install libvpx:x64-windows-static-md opus:x64-windows-static-md
          $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
          $includePath = "$vcpkgRoot\installed\x64-windows-static-md\include"
          $libPath = "$vcpkgRoot\installed\x64-windows-static-md\lib"
          echo "VCPKG_ROOT=$vcpkgRoot" >> $env:GITHUB_ENV
          echo "C_INCLUDE_PATH=$includePath" >> $env:GITHUB_ENV
          echo "CPLUS_INCLUDE_PATH=$includePath" >> $env:GITHUB_ENV
          echo "LIBRARY_PATH=$libPath" >> $env:GITHUB_ENV
          echo "BINDGEN_EXTRA_CLANG_ARGS=-I$includePath" >> $env:GITHUB_ENV

      - name: Install frontend dependencies
        run: npm install

      - name: Build the app (Release)
        if: ${{ !inputs.debug }}
        env:
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${{ inputs.platform }}" == "macos-latest" ]]; then
            npm run tauri:build -- --target aarch64-apple-darwin
          else
            npm run tauri:build
          fi
        shell: bash

      - name: Build the app (Debug)
        if: ${{ inputs.debug }}
        env:
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${{ inputs.platform }}" == "macos-latest" ]]; then
            npm run tauri:build:debug -- --target aarch64-apple-darwin
          else
            npm run tauri:build:debug
          fi
        shell: bash

      - name: Upload artifacts (Linux)
        if: inputs.platform == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: clever-kvm-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/clever-kvm
          if-no-files-found: warn

      - name: Upload artifacts (Windows)
        if: inputs.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: clever-kvm-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/clever-kvm.exe
          if-no-files-found: warn

      - name: Upload artifacts (macOS Apple Silicon)
        if: inputs.platform == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: clever-kvm-macos-arm64
          path: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app
          if-no-files-found: warn
