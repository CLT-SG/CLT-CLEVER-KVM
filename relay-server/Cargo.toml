[package]
name = "clever-relay-server"
version = "1.0.0"
edition = "2021"
authors = ["CLEVER Team"]
description = "High-performance UDP relay server for CLEVER KVM with low-latency video streaming"
license = "MIT"

[dependencies]
# Async runtime
tokio = { version = "1.41", features = ["full", "rt-multi-thread", "net", "sync", "time", "macros"] }

# Networking
socket2 = { version = "0.5", features = ["all"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
log = "0.4"
env_logger = "0.11"

# CLI arguments
clap = { version = "4.5", features = ["derive"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Utils
bytes = "1.9"
parking_lot = "0.12"
dashmap = "6.1"
bitflags = "2.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Compression (optional)
lz4_flex = "0.11"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[[bin]]
name = "clever-relay"
path = "src/main.rs"
