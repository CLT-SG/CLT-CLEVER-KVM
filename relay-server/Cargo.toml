[package]
name = "clever-relay-server"
version = "2.0.0"
edition = "2021"
authors = ["CLEVER Team"]
description = "High-performance relay server for CLEVER KVM with web dashboard, device discovery, and low-latency video streaming"
license = "MIT"

[dependencies]
# Async runtime
tokio = { version = "1.41", features = ["full", "rt-multi-thread", "net", "sync", "time", "macros", "fs"] }

# HTTP Server (Actix Web)
actix-web = "4"
actix-files = "0.6"
actix-ws = "0.3"
actix-rt = "2"

# WebSocket
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"

# Networking
socket2 = { version = "0.5", features = ["all"] }

# mDNS Service Discovery
mdns-sd = "0.11"

# Hostname detection
hostname = "0.4"
gethostname = "0.5"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
log = "0.4"
env_logger = "0.11"

# CLI arguments
clap = { version = "4.5", features = ["derive"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Utils
bytes = "1.9"
parking_lot = "0.12"
dashmap = "6.1"
bitflags = "2.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.11", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }

# Compression (optional)
lz4_flex = "0.11"

# Templating for HTML
tera = "1.20"
lazy_static = "1.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[[bin]]
name = "clever-relay"
path = "src/main.rs"
