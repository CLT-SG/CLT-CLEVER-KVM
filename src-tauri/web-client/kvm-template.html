<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clever KVM</title>
    <link rel="stylesheet" href="/static/kvm-client.css">
</head>
<body>
    <!-- Main screen container -->
    <div id="screen">
        <!-- Video element for native WebRTC media track rendering (primary path).
             When the server sends a VP9/VP8 media track via WebRTC, the browser
             decodes and renders it natively here — no WebCodecs or canvas needed.
             Falls back to canvas rendering when WebRTC media track is unavailable. -->
        <video id="video-screen" autoplay playsinline muted
               style="width: 100%; height: 100%; max-width: 100vw; max-height: 100vh; object-fit: contain; background-color: #000;"></video>
        
        <!-- Canvas layer for input handling only (transparent overlay) -->
        <canvas id="canvas-layer" style="position: absolute; top: 0; left: 0; pointer-events: auto; opacity: 0; z-index: 1;"></canvas>
        
        <!-- Status Display (always visible, independent of OSD hover) -->
        <div class="status-display">
            <div class="loading-spinner"></div>
            <h2>Connecting</h2>
            <p>Establishing connection...</p>
            <div class="status-tips"></div>
        </div>
        
        <!-- OSD Overlay -->
        <div class="osd-overlay">
            <!-- Top OSD Bar -->
            <div class="osd-top">
                <div class="osd-title">Clever KVM</div>
                <div class="osd-info">
                    <span id="fps-display">FPS: <span id="fps">0</span></span>
                    <span id="latency-display">Latency: <span id="latency">0</span>ms</span>
                    <span id="quality-display">Quality: <span id="quality">85</span>%</span>
                </div>
            </div>
            
            <!-- Bottom OSD Controls -->
            <div class="osd-bottom">
                <div class="osd-controls">
                    <select id="monitor-dropdown" class="osd-select">
                        <option value="0">Primary Monitor</option>
                    </select>
                    
                    <select id="codec-dropdown" class="osd-select">
                        <option value="vp9" selected>VP9 (Native Video)</option>
                        <option value="vp8">VP8 (Native Video)</option>
                    </select>
                    
                    <select id="quality-dropdown" class="osd-select">
                        <option value="auto">Auto Quality</option>
                        <option value="high">High Quality</option>
                        <option value="medium">Medium Quality</option>
                        <option value="low">Low Quality</option>
                    </select>
                    
                    <button id="fullscreen-btn" class="osd-button">
                        <svg class="icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
                        Fullscreen
                    </button>
                    
                    <button id="settings-btn" class="osd-button">
                        <svg class="icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                        Settings
                    </button>
                    
                    <button id="disconnect-btn" class="osd-button danger">
                        <svg class="icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><line x1="12" y1="2" x2="12" y2="12"/></svg>
                        Disconnect
                    </button>
                </div>
            </div>
        </div>
        
        <!-- Network Stats -->
        <div class="network-stats">
            <div class="stats-row">
                <span class="stat-label">FPS:</span>
                <span class="stat-value" id="fps">0</span>
            </div>
            <div class="stats-row">
                <span class="stat-label">Latency:</span>
                <span class="stat-value" id="latency">0</span><span class="stat-label">ms</span>
            </div>
            <div class="stats-row">
                <span class="stat-label">Quality:</span>
                <span class="stat-value" id="quality">85</span><span class="stat-label">%</span>
            </div>
            <div class="stats-row">
                <span class="stat-label">Codec:</span>
                <span class="stat-value" id="codec-info">{{codec}}</span>
            </div>
        </div>
        
        <!-- Gesture Indicator -->
        <div class="gesture-indicator"></div>
        
        <!-- Notification Area -->
        <div class="notification-area"></div>
    </div>
    
    <!-- Audio Element -->
    <audio id="remote-audio" autoplay {{mute_attr}}></audio>
    
    <!-- Modern Settings Panel -->
    <div class="settings-panel">
        <div class="settings-header">
            <h3>Settings</h3>
            <button class="close-button">&times;</button>
        </div>
        
        <div class="settings-content">
            <div class="settings-section">
                <div class="section-title">
                    <svg class="icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
                    Display
                </div>
                <div class="setting-item">
                    <label class="setting-label">Stretch to fit window</label>
                    <div class="setting-control">
                        <div class="toggle-switch" data-setting="stretch">
                            <input type="checkbox" id="setting-stretch" hidden {{stretch_checked}}>
                        </div>
                    </div>
                </div>
                <div class="setting-item">
                    <label class="setting-label">Show performance stats</label>
                    <div class="setting-control">
                        <div class="toggle-switch" data-setting="stats">
                            <input type="checkbox" id="setting-stats" hidden>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="settings-section">
                <div class="section-title">
                    <svg class="icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
                    Audio
                </div>
                <div class="setting-item">
                    <label class="setting-label">Enable audio</label>
                    <div class="setting-control">
                        <div class="toggle-switch" data-setting="audio">
                            <input type="checkbox" id="setting-audio" hidden {{audio_checked}}>
                        </div>
                    </div>
                </div>
                <div class="setting-item">
                    <label class="setting-label">Mute audio</label>
                    <div class="setting-control">
                        <div class="toggle-switch" data-setting="mute">
                            <input type="checkbox" id="setting-mute" hidden {{mute_checked}}>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="settings-section">
                <div class="section-title">
                    <svg class="icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
                    Performance
                </div>
                <div class="setting-item">
                    <label class="setting-label">Quality</label>
                    <div class="setting-control">
                        <input type="range" class="range-slider" id="quality-slider" min="25" max="95" value="85">
                        <span class="range-value" id="quality-value">85</span><span class="stat-label">%</span>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="settings-actions">
            <button id="settings-cancel" class="settings-button">Cancel</button>
            <button id="settings-save" class="settings-button primary">Save</button>
        </div>
    </div>

    <!-- Load configuration and initialize -->
    <script>
        // Configuration from server template
        window.KVM_CONFIG = {
            stretch: {{stretch}},
            mute: {{mute}},
            audio: {{audio}},
            remoteOnly: {{remote_only}},
            encryption: {{encryption}},
            monitor: {{monitor}},
            codec: "{{codec}}"
        };
    </script>
    <script src="/static/kvm-template-parts.js"></script>
    <script src="/static/vpx-decoder.js"></script>
    <script src="/static/webrtc-transport.js"></script>
    <script src="/static/kvm-client.js"></script>
</body>
</html>
