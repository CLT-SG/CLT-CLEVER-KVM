[package]
name = "clever-kvm"
version = "4.1.0"
description = "A KVM solution built with Tauri"
authors = ["Clever Technologies"]
license = "MIT"
repository = "https://github.com/CLTSG/CLT-CLEVER-KVM"
homepage = "https://github.com/CLTSG/CLT-CLEVER-KVM"
documentation = "https://github.com/CLTSG/CLT-CLEVER-KVM#readme"
keywords = ["kvm", "remote-desktop", "tauri", "h264", "streaming"]
categories = ["multimedia", "network-programming"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = [ "window-all", "fs-all", "dialog-all", "notification-all", "process-all", "os-all", "global-shortcut-all", "shell-open", "updater"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.32.0", features = ["full"] }
axum = { version = "0.7.2", features = ["ws"] }
futures-util = "0.3.28"
log = "0.4.20"
env_logger = "0.10.0"
enigo = "0.1.3"
local-ip-address = "0.5.6"
tower-http = { version = "0.5.0", features = ["fs", "trace"] }
lazy_static = "1.4.0"
gethostname = "0.4.3"

# Relay client dependencies
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
tracing = "0.1"
reqwest = { version = "0.12", features = ["json"] }
hostname = "0.4"

# Ultra-performance dependencies for streaming
webrtc = "0.11.0"
# Use zed-scap fork instead of scap for Windows compatibility
# The original scap 0.1.0-beta.1 has breaking API changes with windows-capture 1.5.0
# zed-scap uses windows-capture ^1.3.6 but we must pin to 1.4.4 to avoid 1.5.0 breaking changes
zed-scap = "0.0.8-zed"
anyhow = "1.0.75"
thiserror = "1.0.50"

# Video encoding and H.264 container support
# webm = "1.1" # WebM container format (legacy, kept for audio container)
opus = "0.3" # Opus audio codec
# matroska = "0.14" # Matroska/WebM muxing (legacy)
image = "0.24" # Image processing for YUV conversion
av-data = "0.4" # Audio/Video data structures

# Ultra-high performance dependencies for optimization
parking_lot = "0.12" # High-performance locks (replaces std::sync::Mutex)
rayon = "1.8" # Data parallelism for SIMD and multi-core processing
mimalloc = { version = "0.1", optional = true } # Microsoft's high-performance allocator

# Windows-specific dependencies
# Pin windows-capture to 1.4.4 to avoid breaking API changes in 1.5.0
[target.'cfg(windows)'.dependencies]
windows-capture = "=1.4.4"

# Linux-specific dependencies (X11 support)
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["randr"] }

# macOS-specific dependencies (Core Graphics support)
[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.24"
core-foundation = "0.10"

[features]
# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
# Ultra-performance features
default = ["mimalloc"] # Use Microsoft's allocator by default for best performance
ultra-performance = ["mimalloc"] # Enable all performance optimizations
