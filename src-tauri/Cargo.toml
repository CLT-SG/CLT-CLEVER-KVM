[package]
name = "clever-kvm"
version = "5.0.12"
description = "A KVM solution built with Tauri"
authors = ["Clever Technologies"]
license = "MIT"
repository = "https://github.com/CLTSG/CLT-CLEVER-KVM"
homepage = "https://github.com/CLTSG/CLT-CLEVER-KVM"
documentation = "https://github.com/CLTSG/CLT-CLEVER-KVM#readme"
keywords = ["kvm", "remote-desktop", "tauri", "vp9", "streaming"]
categories = ["multimedia", "network-programming"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "1.5", features = [] }
bindgen = "0.70"  # Generate VPX FFI bindings from system libvpx headers

[dependencies]
tauri = { version = "1.5", features = [ "window-all", "fs-all", "dialog-all", "notification-all", "process-all", "os-all", "global-shortcut-all", "shell-open", "updater", "system-tray", "path-all"] }
auto-launch = "0.5"
dirs = "5.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.32.0", features = ["full"] }
axum = { version = "0.7.2", features = ["ws"] }
futures-util = "0.3.28"
log = "0.4.20"
env_logger = "0.10.0"
fern = "0.7"  # File-based logging with custom formatting
chrono = "0.4"  # Timestamps for log entries
enigo = "0.1.3"
local-ip-address = "0.5.6"
tower-http = { version = "0.5.0", features = ["fs", "trace"] }
lazy_static = "1.4.0"
gethostname = "0.4.3"

anyhow = "1.0.75"
thiserror = "1.0.50"
opus = "0.3" # Opus audio codec

# TLS/HTTPS support (required for WebCodecs API on non-localhost)
axum-server = { version = "0.7", features = ["tls-rustls"] }
rcgen = "0.12" # Self-signed certificate generation at runtime
rustls = "0.23"
rustls-pemfile = "2"

# RustDesk-inspired codec dependencies (VPX bindings generated by bindgen in build.rs)
libc = "0.2" # C types for libvpx FFI
cpal = "0.15" # Cross-platform audio capture (WASAPI/ALSA/CoreAudio)
crossbeam-queue = "0.3" # Lock-free bounded queue for video frames
crossbeam-channel = "0.5" # Lock-free MPMC channels

# WebRTC for low-latency peer-to-peer video/audio streaming
webrtc = "0.17" # Pure Rust WebRTC (DataChannel + Media tracks over UDP)
bytes = "1"     # Binary data buffers (used by WebRTC DataChannel send API)

# Ultra-high performance dependencies for optimization
parking_lot = "0.12" # High-performance locks (replaces std::sync::Mutex)
mimalloc = { version = "0.1", optional = true } # Microsoft's high-performance allocator

# Windows-specific dependencies
# Pin windows-capture to 1.4.4 to avoid breaking API changes in 1.5.0
[target.'cfg(windows)'.dependencies]
windows-capture = "=1.4.4"

# Linux-specific dependencies (X11 support + SHM for zero-copy capture like RustDesk's scrap)
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["randr", "shm"] }

# macOS-specific dependencies (Core Graphics support)
[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.24"
core-foundation = "0.10"

[features]
# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
# Ultra-performance features
default = ["mimalloc"] # Use Microsoft's allocator by default for best performance
ultra-performance = ["mimalloc"] # Enable all performance optimizations
