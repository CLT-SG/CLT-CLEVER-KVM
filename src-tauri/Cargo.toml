[package]
name = "clever-kvm"
version = "3.0.0"
description = "A KVM solution built with Tauri"
authors = ["Clever Technologies"]
license = "MIT"
repository = "https://github.com/CLTSG/CLT-CLEVER-KVM"
homepage = "https://github.com/CLTSG/CLT-CLEVER-KVM"
documentation = "https://github.com/CLTSG/CLT-CLEVER-KVM#readme"
keywords = ["kvm", "vnc", "tauri", "video-wall", "streaming"]
categories = ["multimedia", "network-programming"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = [ "window-all", "fs-all", "dialog-all", "notification-all", "process-all", "os-all", "global-shortcut-all", "shell-open", "updater"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.32.0", features = ["full"] }
axum = { version = "0.7.2", features = ["ws"] }
futures-util = "0.3.28"
log = "0.4.20"
env_logger = "0.10.0"
enigo = "0.1.3"
local-ip-address = "0.5.6"
tower-http = { version = "0.5.0", features = ["fs", "trace"] }
lazy_static = "1.4.0"
gethostname = "0.4.3"

# Ultra-performance dependencies for streaming
webrtc = "0.11.0"
xcap = "0.0.10"
anyhow = "1.0.75"
thiserror = "1.0.50"

# Video encoding and WebM container support
webm = "1.1" # WebM container format
opus = "0.3" # Opus audio codec
matroska = "0.14" # Matroska/WebM muxing
image = "0.24" # Image processing for YUV conversion
av-data = "0.4" # Audio/Video data structures

# Ultra-high performance dependencies for optimization
parking_lot = "0.12" # High-performance locks (replaces std::sync::Mutex)
rayon = "1.8" # Data parallelism for SIMD and multi-core processing
mimalloc = { version = "0.1", optional = true } # Microsoft's high-performance allocator

# VNC Server dependencies
vnc = "0.4" # VNC/RFB protocol implementation
cpal = "0.15" # Cross-platform audio capture
bytes = "1.5" # Byte buffer manipulation
crossbeam-channel = "0.5" # High-performance channels for audio streaming
reqwest = { version = "0.11", features = ["json"] } # HTTP client for clever-service registration
chrono = "0.4" # Date/time handling for registration timestamps
tokio-tungstenite = { version = "0.21", features = ["native-tls"] } # WebSocket support with TLS
tokio-native-tls = "0.3" # TLS support for WebSocket connections
native-tls = "0.2" # TLS implementation
rcgen = "0.12" # Self-signed certificate generation
dirs = "5.0" # Platform-specific directories
time = "0.3" # Time/date handling for certificate validity

# Structured logging
tracing = "0.1" # Structured logging framework
tracing-subscriber = { version = "0.3", features = ["env-filter"] } # Log formatting and filtering
tracing-appender = "0.2" # File-based logging with rotation

[features]
# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
# Ultra-performance features
default = ["mimalloc"] # Use Microsoft's allocator by default for best performance
ultra-performance = ["mimalloc"] # Enable all performance optimizations
